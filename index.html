<style>
/* Layout idea: one-thumb phone app. 112 is one tap from every screen; each emergency gets its own second screen. Single light theme by choice: high contrast under stress. */
:root{
  --ink:#121417;--paper:#F4F4F1;--surface:#FFFFFF;--line:#DADBD5;--muted:#565B58;
  --signal:#D7261E;--signal-hi:#FF5A4E;--signal-soft:#FBE4E2;--calm:#1F6F5C;--calm-soft:#DDF0E8;
  --warn-ink:#6E4100;--warn-soft:#FFF0D2;--warn-line:#F0D49A;--ink2:#2A2E33;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:400 15px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px;border-radius:8px}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:var(--paper);border-bottom:1px solid var(--line)}
.brand{font:800 24px/1 var(--display);letter-spacing:.5px;text-transform:uppercase;display:flex;gap:8px;align-items:center;flex:1}
.dot{width:11px;height:11px;border-radius:50%;background:var(--signal)}
.back{display:flex;align-items:center;justify-content:center;min-width:40px;min-height:40px;margin-left:-8px;text-decoration:none;background:none;border:0}
.ttl{font:700 20px/1 var(--display);text-transform:uppercase;letter-spacing:.4px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p112{background:var(--signal);color:#fff;text-decoration:none;border-radius:999px;padding:0 14px;min-height:40px;font:700 18px/1 var(--display);display:flex;gap:6px;align-items:center;flex:none}
.p112 small{font:600 12px/1 var(--body)}
main.body{flex:1;padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px}
.h1{font:800 32px/1.02 var(--display);text-transform:uppercase;margin:0;text-wrap:balance}
.h2{font:700 18px/1.1 var(--display);text-transform:uppercase;letter-spacing:.5px;margin:0}
.muted{color:var(--muted);font-size:13px;line-height:1.4;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.card.warn{background:var(--warn-soft);border-color:var(--warn-line);color:#4A2C00}
.card.calm{border:2px solid var(--calm)}
.card.redline{border:2px solid var(--signal)}
.dark{background:var(--ink);color:var(--paper);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.btn{appearance:none;border:0;display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border-radius:12px;padding:0 14px;font-weight:600;font-size:15px;text-decoration:none;background:var(--ink);color:var(--paper);text-align:center;line-height:1.2}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid #CFD1CA}
.btn.red{background:var(--signal);color:#fff}
.btn.calm{background:var(--calm);color:#fff}
.btn.sm{font-size:14px;padding:0 12px;border-radius:10px}
.btn[disabled]{opacity:.5}
.bigcall{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--signal);color:#fff;text-decoration:none;border-radius:16px;padding:12px 18px;min-height:72px}
.bigcall .l{display:flex;flex-direction:column;gap:2px}
.bigcall .l b{font-size:16px}
.bigcall .l small{font-size:12px;opacity:.95}
.bigcall .n{font:800 46px/1 var(--display);font-variant-numeric:tabular-nums}
.pill{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:3px 8px;border-radius:6px;background:#ECECE6;color:var(--ink);white-space:nowrap}
.pill.free{background:var(--calm);color:#fff}
.pill.warn{background:var(--warn-soft);color:var(--warn-ink)}
.pill.red{background:var(--signal-soft);color:#A51C16}
.pill.ok{background:var(--calm-soft);color:#14513F}
.row{display:flex;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;border:1px solid #CFD1CA;background:var(--surface);border-radius:999px;padding:0 12px;min-height:36px;display:inline-flex;align-items:center;font-size:13px;font-weight:600;text-decoration:none}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ico{width:22px;height:22px;flex:none}
.big{font:800 44px/1 var(--display);font-variant-numeric:tabular-nums}
.tile{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px;text-decoration:none;display:flex;flex-direction:column;gap:6px;min-height:118px}
.tile b{font:700 22px/1 var(--display);text-transform:uppercase}
.tile span{font-size:13px;color:var(--muted);line-height:1.35}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:12px;min-height:72px}
.listlink{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-decoration:none;min-height:56px}
.listlink .t{font-weight:700;font-size:15px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid #CFD1CA;background:var(--paper);border-radius:10px;padding:10px 12px;width:100%;min-height:44px}
.field textarea{min-height:72px;resize:vertical}
.status{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 10px;border-radius:10px;background:var(--paper);border:1px solid var(--line)}
.status i{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.status.ok i{background:var(--calm)}
.status.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn-ink)}
.status.warn i{background:var(--warn-ink)}
.msg{font:500 13px/1.5 var(--body);white-space:pre-wrap;background:var(--paper);border:1px dashed #CFD1CA;border-radius:10px;padding:10px 12px;margin:0;overflow-wrap:anywhere}
.script{background:var(--signal-soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.script b{font:700 15px/1 var(--display);letter-spacing:.6px;text-transform:uppercase;color:#A51C16}
.script p{margin:0;font-size:15px}
.job{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--signal);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.job[data-lv="mid"]{border-left-color:#C58A1A}
.job[data-lv="done"]{border-left-color:var(--calm)}
.job summary{list-style:none;display:flex;align-items:center;gap:12px;cursor:pointer;min-height:40px}
.job summary::-webkit-details-marker{display:none}
.job .jn{font:700 17px/1.1 var(--display);text-transform:uppercase;letter-spacing:.3px}
.dots{display:flex;gap:4px}
.dots i{flex:1;height:5px;border-radius:99px;background:var(--line)}
.dots i.on{background:var(--ink)}
.prov{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.prov.rec{border:2px solid var(--ink)}
.prov.off{opacity:.55}
.prov .pn{font:700 19px/1.05 var(--display);text-transform:uppercase}
.step{display:flex;align-items:center;gap:10px;min-height:34px}
.step .s{width:22px;height:22px;border-radius:50%;border:2px solid #CFD1CA;flex:none;display:flex;align-items:center;justify-content:center}
.step.done .s{background:var(--calm);border-color:var(--calm)}
.step.now .s{border:6px solid var(--signal)}
.step .tx{flex:1;font-size:15px}
.step.now .tx{font-weight:700}
.step .tm{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.hosp{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.hosp.chosen{border:2px solid var(--ink)}
.km{font:800 24px/1 var(--display);font-variant-numeric:tabular-nums;text-align:right}
.km small{display:block;font:500 11px/1.2 var(--body);color:var(--muted)}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px;font-size:14px}
details.aid{background:var(--surface);border:1px solid var(--line);border-radius:14px}
details.aid summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px}
details.aid summary::-webkit-details-marker{display:none}
details.aid summary b{font:700 19px/1.1 var(--display);text-transform:uppercase}
details.aid summary span{font-size:12px;color:var(--muted)}
details.aid summary::after{content:"+";font:700 24px/1 var(--display);color:var(--signal)}
details.aid[open] summary::after{content:"–"}
details.aid .in{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.dont{font-size:14px;background:var(--signal-soft);border-radius:10px;padding:8px 12px;margin:0}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.todo label{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;font-size:14px}
.todo input{width:20px;height:20px;margin-top:1px;accent-color:var(--calm);flex:none}
.todo input:checked + span{color:var(--muted);text-decoration:line-through}
.log{list-style:none;margin:0 0 0 6px;padding:0;border-left:2px solid var(--line)}
.log li{position:relative;padding:3px 0 9px 16px;font-size:14px}
.log li::before{content:"";position:absolute;left:-6px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--ink)}
.log time{font:700 15px/1 var(--display);font-variant-numeric:tabular-nums;margin-right:8px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.camera{position:relative;border-radius:16px;background:#23272B;color:var(--paper);min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center}
.camera input{position:absolute;width:1px;height:1px;opacity:0}
.shutter{width:72px;height:72px;border-radius:50%;border:5px solid var(--paper);background:var(--signal);display:block;cursor:pointer}
.cpr{display:flex;flex-direction:column;align-items:center;gap:14px;padding:8px 0}
.beat{width:200px;height:200px;border-radius:50%;background:var(--signal);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;border:0}
.beat b{font:800 64px/1 var(--display);font-variant-numeric:tabular-nums}
.beat span{font-size:13px}
.beat.pulse{animation:beat .545s infinite}
@keyframes beat{0%{transform:scale(1)}18%{transform:scale(.88)}40%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.beat.pulse{animation:none}}
.overlay{position:fixed;inset:0;z-index:50;background:#0E1012;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:80px 24px 60px;text-align:center}
.overlay .who{font:700 34px/1.1 var(--body)}
.overlay .sub{opacity:.75;margin-top:8px}
.overlay .acts{display:flex;gap:56px}
.overlay .acts button{width:72px;height:72px;border-radius:50%;border:0;color:#fff;font-weight:700}
nav.tabs{position:sticky;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;font-size:12px;font-weight:600;text-decoration:none;color:var(--muted)}
nav.tabs a[aria-current="page"]{color:var(--signal);font-weight:700}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;max-width:90vw;text-align:center}
.idc{background:var(--ink);color:var(--paper);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.idc .nm{font:800 28px/1 var(--display);text-transform:uppercase}
.idc .bg{font:800 40px/1 var(--display);color:var(--signal-hi)}
.idc dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.idc dt{opacity:.7}.idc dd{margin:0;overflow-wrap:anywhere}
.breath{width:120px;height:120px;border-radius:50%;background:var(--calm-soft);border:3px solid var(--calm);animation:br 10s ease-in-out infinite}
@keyframes br{0%{transform:scale(.6)}40%{transform:scale(1)}100%{transform:scale(.6)}}
@media (prefers-reduced-motion:reduce){.breath{animation:none}}
.nb{position:absolute;top:4px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--signal);color:#fff;font:700 10px/16px var(--body);text-align:center}
.nb.dot{min-width:0;width:9px;height:9px;padding:0;top:7px}
.fine{font-size:12px;color:var(--muted);text-align:center;padding:4px 16px 16px}
</style>
</head>

  {id:"tow",t:"Road clearance",icon:"tow",call:["100","1033"],steps:["Not asked","Requested","On the way","Road cleared"],hint:"In the city, traffic police arrange the crane: ask when you call 100. On a national highway, call 1033."},

function ic(n,c,s,w){return `<svg class="ico" style="width:${s||22}px;height:${s||22}px;color:${c||"currentColor"}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w||2}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;}

/* =============== storage & state =============== */
const KEY="sahaay.v1";
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
let DB=load();DB.mid=DB.mid||{};DB.ratings=DB.ratings||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));return true}catch(e){return false}}
const S={loc:DB.loc||null,gpsErr:null,gpsBusy:false,photos:[],hseg:"near",pfilter:"best",cpr:{on:false,n:0,start:0},closeArm:false};
let INC=DB.inc||null;
function saveInc(){DB.inc=INC;save();}

/* =============== helpers =============== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const now=()=>Date.now();
const tstr=t=>new Date(t).toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"});
function km(a,b){const r=Math.PI/180,dA=(b.lat-a.lat)*r,dO=(b.lng-a.lng)*r;const h=Math.sin(dA/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dO/2)**2;return 12742*Math.asin(Math.sqrt(h));}
function fmtKm(d){return d==null?"–":d<10?d.toFixed(1):String(Math.round(d));}
function toast(t){const el=document.createElement("div");el.className="toast";el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2400);}
function newId(){return "HYD-"+Math.floor(1000+Math.random()*9000);}
function addLog(txt){if(!INC)return;INC.log.push({t:now(),txt});saveInc();}
function startInc(kind,extra){
  INC=Object.assign({id:newId(),kind,start:now(),role:null,tri:{inj:null,con:null,br:null,bl:null,veh:[]},symptom:null,
    jobs:{},mine:{},calls:[],amb:null,hospName:"",done:{},log:[],loc:S.loc},extra||{});
  JOBS.forEach(j=>INC.jobs[j.id]=0);
  addLog(`${KIND[kind]} started`);saveInc();
  if(!S.loc||S.loc.src!=="gps")gps();
  return INC;
}
function ensureInc(kind){if(!INC)startInc(kind);return INC;}

/* =============== location =============== */
function gps(){
  if(S.gpsBusy)return;
  if(!("geolocation" in navigator)){S.gpsErr="This browser can't share location. Pick your area.";render();return;}
  S.gpsBusy=true;S.gpsErr=null;
  try{
    navigator.geolocation.getCurrentPosition(p=>{
      S.gpsBusy=false;S.loc={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,src:"gps",t:now()};
      DB.loc=S.loc;save();if(INC){INC.loc=S.loc;saveInc();}render(true);
    },()=>{S.gpsBusy=false;S.gpsErr="Location is blocked. Pick your area and add a landmark.";render(true);},{enableHighAccuracy:true,timeout:12000,maximumAge:20000});
  }catch(e){S.gpsBusy=false;S.gpsErr="Location is blocked. Pick your area and add a landmark.";render(true);}
}
function whereText(){
  const l=S.loc;
  if(l&&l.src==="gps")return `https://maps.google.com/?q=${l.lat.toFixed(5)},${l.lng.toFixed(5)}`;
  if(l&&l.src==="area")return `${l.label}, Hyderabad`;
  return "Location not set";
}
function locCard(){
  const l=S.loc;
  let st;
  if(S.gpsBusy)st=`<div class="status"><i></i>Finding you…</div>`;
  else if(l&&l.src==="gps")st=`<div class="status ok"><i></i>Live location · ±${Math.round(l.acc||0)} m</div>`;
  else if(l&&l.src==="area")st=`<div class="status ok"><i></i>Area: ${esc(l.label)}</div>`;
  else if(S.gpsErr)st=`<div class="status warn"><i></i>${esc(S.gpsErr)}</div>`;
  else st=`<div class="status"><i></i>Location not set yet</div>`;
  const lm=INC?INC.landmark||"":DB.landmark||"";
  return `<div class="card"><div class="row" style="justify-content:space-between"><h2 class="h2">Location</h2><button class="btn sm ghost" type="button" data-a="gps">${ic("loc",null,18)}Use GPS</button></div>${st}
  <div class="grid2"><div class="field"><label for="area">Area</label><select id="area" data-c="area"><option value="">Choose…</option>${AREAS.map(a=>`<option ${l&&l.src==="area"&&l.label===a[0]?"selected":""}>${esc(a[0])}</option>`).join("")}</select></div>
  <div class="field"><label for="lm">Landmark</label><input id="lm" data-c="lm" value="${esc(lm)}" placeholder="Metro pillar no., petrol bunk"></div></div></div>`;
}

/* =============== messages =============== */
function triText(){
  if(!INC)return "";const t=INC.tri,p=[];
  if(t.inj)p.push(`${t.inj} injured`);
  if(t.con==="No")p.push("someone is unconscious");
  if(t.br==="No")p.push("someone is not breathing");
  if(t.bl==="Yes")p.push("heavy bleeding");
  if(t.veh.length)p.push("vehicles: "+t.veh.join(", ").toLowerCase());
  if(INC.symptom){const s=SYMPTOMS.find(x=>x.id===INC.symptom);if(s)p.push(s.t.toLowerCase());}
  return p.join(", ");
}
function script(){
  const l=S.loc,lm=INC&&INC.landmark;
  const where=l&&l.src==="area"?`near ${l.label}`:"at [say the road and area]";
  const what=INC?KIND[INC.kind].toLowerCase():"emergency";
  const tri=triText();
  return `“${what.charAt(0).toUpperCase()+what.slice(1)} ${where}.${lm?` Landmark: ${lm}.`:" Landmark: [metro pillar, petrol bunk, junction]."}${tri?" "+tri.charAt(0).toUpperCase()+tri.slice(1)+".":""} Please send an ambulance.”`;
}
function updateMsg(){
  if(!INC)return "";
  const m=DB.mid,mins=Math.floor((now()-INC.start)/60000);
  const L=[`${KIND[INC.kind].toUpperCase()} · ${INC.id}`,`Where: ${whereText()}${INC.landmark?` (${INC.landmark})`:""}`,`Since: ${tstr(INC.start)} (${mins} min ago)`];
  const tri=triText();if(tri)L.push(`Status: ${tri}`);
  if(INC.amb){const p=PROVIDERS.find(x=>x.id===INC.amb.provider);L.push(`Ambulance: ${p?p.name:"called"} · ${JOBS[0].steps[INC.jobs.amb]}${INC.amb.eta?` · ETA ${tstr(INC.amb.eta)}`:""}`);}
  else L.push("Ambulance: not called yet");
  if(INC.kind==="accident")L.push(`Police: ${JOBS[1].steps[INC.jobs.police]}`);
  if(INC.hospName)L.push(`Hospital: ${INC.hospName}`);
  if(m.blood)L.push(`Blood group: ${m.blood}`);
  L.push("Sent from Sahaay");
  return L.join("\n");
}
function sosMsg(){
  const m=DB.mid;
  return [`I NEED HELP.${m.name?" This is "+m.name+".":""}`,`My location: ${whereText()}`,`Time: ${tstr(now())}`,"Please call me. If I don't answer, call 112."].join("\n");
}
function contacts(){const m=DB.mid;return [[m.c1n,m.c1p],[m.c2n,m.c2p]].filter(c=>c[1]);}
function shareBtns(msg,act){
  const enc=encodeURIComponent(msg);
  return `<div class="grid2"><a class="btn red" href="https://wa.me/?text=${enc}" target="_blank" rel="noopener" data-a="${act}">WhatsApp</a>${contacts().map(c=>`<a class="btn" href="sms:${esc(c[1])}?&body=${enc}" data-a="${act}">SMS ${esc(c[0]||c[1])}</a>`).join("")||`<a class="btn" href="sms:?&body=${enc}" data-a="${act}">SMS</a>`}<button class="btn ghost" type="button" data-a="copy" data-v="${esc(msg)}">Copy</button></div>
  ${contacts().length?"":`<p class="muted">Add emergency contacts in <a href="#me">Me</a> to text them in one tap.</p>`}`;
}

V.report=()=>{

function chips(key,opts,multi){

}
function lv(j){const s=INC.jobs[j.id];return s===0?"0":s===j.steps.length-1?"done":"mid";}
function pillFor(j){const s=INC.jobs[j.id],l=lv(j);return `<span class="pill ${l==="done"?"ok":l==="mid"?"warn":"red"}">${esc(j.steps[s])}</span>`;}
function jobRow(j){
  const s=INC.jobs[j.id],l=lv(j);
  if(j.id==="amb"){
    if(!INC.amb)return `<a href="#ambulance" class="bigcall" style="min-height:64px">${ic("amb","#fff",26)}<span class="l" style="flex:1"><b style="font:800 21px/1 var(--display);text-transform:uppercase">Get an ambulance</b><small>Nobody has called yet · ${PROVIDERS.filter(p=>!p.off).length} options near you</small></span>${ic("chev","#fff")}</a>`;

  if(j.id==="family")return `<a href="#family" class="listlink job" data-lv="${l}" style="border-left-width:6px">${ic("users")}<div style="flex:1;min-width:0"><div class="jn">Family</div><div class="muted" style="font-size:12px">${s?"Update sent":"Send them live status"}</div></div>${pillFor(j)}${ic("chev","var(--muted)",18)}</a>`;

  <p class="muted">${esc(j.hint)}</p></details>`;
}
function clock(){const s=Math.max(0,Math.floor((now()-INC.start)/1000));return {txt:`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`,pct:Math.min(100,s/36)};}

<div class="row" style="justify-content:space-between;font:700 12px/1 var(--display);letter-spacing:1px;text-transform:uppercase;opacity:.8"><span>${esc(INC.id)}</span><span>Started ${tstr(INC.start)}</span></div>
<div class="row" style="align-items:baseline"><span class="big" id="clk">${c.txt}</span><span style="font-size:13px;opacity:.85;line-height:1.3">into the golden hour.<br>The first 60 minutes decide the most.</span></div>
<div style="height:7px;border-radius:99px;background:rgba(244,244,241,.18)"><div id="clkbar" style="width:${c.pct}%;height:7px;border-radius:99px;background:var(--signal-hi)"></div></div>
<div style="font-size:13px;opacity:.9;overflow-wrap:anywhere">${esc(whereText())}${INC.landmark?" · "+esc(INC.landmark):""}</div>
</div>
<div class="grid2">
<button type="button" class="chip" style="min-height:56px;border-radius:14px;justify-content:center;font-size:15px" data-a="role" data-v="victim" aria-pressed="${INC.role==="victim"}">I'm in it</button>
<button type="button" class="chip" style="min-height:56px;border-radius:14px;justify-content:center;font-size:15px" data-a="role" data-v="helper" aria-pressed="${INC.role==="helper"}">I'm helping</button>
</div>
<div class="card redline">
<div class="row" style="justify-content:space-between"><h2 class="h2">1 · Call 108</h2><span class="muted">Tap what you see</span></div>
<div class="field"><label>How many hurt?</label>${chips("inj",["1","2","3+"])}</div>
<div class="field"><label>Everyone awake?</label>${chips("con",["Yes","No","Not sure"])}</div>
<div class="field"><label>Everyone breathing?</label>${chips("br",["Yes","No","Not sure"])}</div>
<div class="field"><label>Heavy bleeding?</label>${chips("bl",["Yes","No"])}</div>
<div class="field"><label>Vehicles</label>${chips("veh",["Two-wheeler","Car","Auto","Bus / truck","Pedestrian"],true)}</div>
<div class="script"><b>Say this</b><p id="scr">${esc(script())}</p></div>
${INC.tri.br==="No"?`<a class="btn red" href="#cpr">Someone isn't breathing: start CPR</a>`:""}
</div>
${locCard()}
<div class="row" style="justify-content:space-between"><h2 class="h2">2 · Jobs</h2><span class="muted">${JOBS.filter(j=>INC.jobs[j.id]>0).length}/${JOBS.length} moving</span></div>
${JOBS.map(jobRow).join("")}
<div class="card"><h2 class="h2">3 · Right now</h2>
<ol class="steps">${(INC.role==="victim"?["Stay still if you can. Moving can worsen a neck or back injury.","Hazard lights on, engine off.","Hand this phone to someone nearby and show them this screen.","Don't argue with the other driver. Photos and the police record settle it later."]:["Make it safe: hazard lights on, wave traffic away.","Point at one person: “You, call 108.” Crowds assume someone already did.","Don't move them. Leave the helmet on unless they can't breathe.","Press hard on heavy bleeding with a cloth.","Keep them still, warm and talking. No water."]).map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
<div class="chips"><a class="chip" href="#cpr">CPR</a><a class="chip" href="#aid" data-a="openaid" data-v="bleed">Bleeding</a><a class="chip" href="#aid" data-a="openaid" data-v="road">Full road guide</a></div></div>
<div class="card"><div class="row" style="justify-content:space-between"><h2 class="h2">4 · Photos</h2><span class="muted">${S.photos.length} on this phone</span></div>
<p class="muted">Wide shot, every number plate, a road sign or landmark. Never post victims online.</p>
<label class="btn ghost" for="shot2">${ic("cam")}Add photos<input id="shot2" type="file" accept="image/*" capture="environment" multiple data-c="photo" style="position:absolute;width:1px;height:1px;opacity:0"></label>
${S.photos.length?`<div class="photos">${S.photos.map(u=>`<img src="${u}" alt="Accident photo">`).join("")}</div>`:""}</div>
<div class="card"><div class="row" style="justify-content:space-between"><h2 class="h2">5 · After</h2><span class="muted">${AFTER.filter(a=>INC.done[a[0]]).length}/${AFTER.length}</span></div>
<ul class="todo">${AFTER.map(a=>`<li><label><input type="checkbox" data-c="done" data-k="${a[0]}" ${INC.done[a[0]]?"checked":""}><span>${esc(a[1])}</span></label></li>`).join("")}</ul></div>
${timeline()}
</main>`;
};

function timeline(){
  return `<div class="card"><h2 class="h2">Timeline</h2><ul class="log">${INC.log.slice().reverse().map(l=>`<li><time>${tstr(l.t)}</time>${esc(l.txt)}</li>`).join("")}</ul>
<button type="button" class="btn sm ghost" data-a="close">${S.closeArm?"Tap again to close it":"Close this emergency"}</button></div>`;
}

V.medical=()=>top("Medical","home")+`<main class="body">
<div><h1 class="h1">What do you see?</h1><p class="muted" style="margin-top:6px">Pick the closest one. It goes into the call script and tells you what to do until help arrives.</p></div>
<div class="grid2">${SYMPTOMS.map(s=>`<a href="#${s.id==="cpr"?"cpr":"ambulance"}" data-a="symptom" data-v="${s.id}" style="${s.red?"grid-column:1/-1;background:var(--signal);color:#fff;border-color:var(--signal);":"background:var(--surface);"}border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-decoration:none;display:flex;flex-direction:column;gap:3px;min-height:60px;justify-content:center"><span style="font:700 18px/1.05 var(--display);text-transform:uppercase">${esc(s.t)}</span><span style="font-size:12px;line-height:1.3;${s.red?"":"color:var(--muted)"}">${esc(s.s)}</span></a>`).join("")}</div>
<a class="btn" href="#ambulance" data-a="symptom" data-v="other" style="min-height:52px">${ic("amb","var(--paper)")}Skip, just get an ambulance</a>
</main>`;

V.cpr=()=>{
  ensureInc("medical");if(!INC.symptom){INC.symptom="cpr";saveInc();}
  const c=S.cpr,el=c.on?Math.floor((now()-c.start)/1000):0;
  return top("CPR","medical")+`<main class="body">
${bigcall("108","Call 108 first","Put it on speaker, then push")}
<div class="cpr">
<button type="button" class="beat ${c.on?"pulse":""}" data-a="cpr" aria-label="${c.on?"Stop the beat":"Start the beat"}"><b id="cprn">${c.on?c.n:"GO"}</b><span id="cprs">${c.on?"pushes · tap to stop":"Tap to start the beat"}</span></button>
<div style="font-size:14px;text-align:center" id="cprt">${c.on?`Swap with someone at 2:00 · <b>${Math.floor(el/60)}:${String(el%60).padStart(2,"0")}</b>`:"Push down on each beat. 110 a minute, 5–6 cm deep."}</div>
</div>
<div class="card"><ol class="steps">${AID.cpr.steps.slice(1,5).map(s=>`<li>${esc(s)}</li>`).join("")}</ol><p class="dont">${esc(AID.cpr.dont)}</p></div>
<a class="btn ghost" href="#ambulance">Ambulance options</a>
</main>`;
};

function provCard(p){
  const r=DB.ratings[p.id]||{};
  const warn=r.answered===false?`<span class="pill red">Didn't answer you last time</span>`:"";
  const called=INC&&INC.calls.some(c=>c.num===p.num);
  return `<div class="prov ${p.rec?"rec":""} ${p.off?"off":""}">${p.rec?`<span class="pill free" style="align-self:flex-start">Best first call</span>`:""}
  <div class="row" style="align-items:flex-start"><div style="flex:1;min-width:0"><div class="pn">${esc(p.name)}</div><div class="muted" style="font-size:12px">${esc(p.op)}</div></div>
  ${p.off?`<span class="pill">Not in Hyderabad yet</span>`:`<a href="tel:${p.num}" class="btn sm ${p.rec?"red":""}" data-a="callamb" data-v="${p.id}">${ic("phone","#fff",16)}${called?"Call again":"Call"}</a>`}</div>
  <div class="chips" style="gap:4px">${p.tags.map(t=>`<span class="pill ${t[1]}">${esc(t[0])}</span>`).join("")}${warn}${r.charged?`<span class="pill">Charged ₹ last time</span>`:""}</div>
  <div style="font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums">${esc(p.disp)}${called?" · called":""}</div></div>`;
}
V.ambulance=()=>{
  let list=PROVIDERS.slice();
  if(S.pfilter==="free")list=list.filter(p=>p.free&&!p.off);
  if(S.pfilter==="als")list=list.filter(p=>p.als&&!p.off);
  list.sort((a,b)=>((DB.ratings[a.id]||{}).answered===false)-((DB.ratings[b.id]||{}).answered===false));
  const sym=INC&&INC.symptom&&SYMPTOMS.find(s=>s.id===INC.symptom);
  return top("Get an ambulance",INC?kindRoute(INC.kind):"medical")+`<main class="body" style="gap:10px">
<p style="margin:0;font-size:14px">Every option near you, in one list. Each call goes straight to the provider. Nobody in between.</p>
${INC?`<div class="script"><b>Say this</b><p>${esc(script())}</p></div>`:""}
<div class="chips">${[["best","Best for you"],["free","Free"],["als","Advanced life support"]].map(f=>`<button type="button" class="chip" data-a="pfilter" data-v="${f[0]}" aria-pressed="${S.pfilter===f[0]}">${f[1]}</button>`).join("")}</div>
<div class="card warn" style="flex-direction:row;gap:10px"><b style="font-size:18px;line-height:1">!</b><p style="margin:0;font-size:13px"><b>Critical?</b> Call 108 and one private service at the same time. Cancel the slower one.</p></div>
${list.map(provCard).join("")}
${INC&&INC.amb?`<a class="btn" href="#tracking">Track the ambulance</a>`:""}
${sym&&sym.aid?`<a class="btn ghost" href="#aid" data-a="openaid" data-v="${sym.aid}">While you wait: ${esc(AID[sym.aid].t)}</a>`:""}
<p class="muted" style="font-size:12px">A hospital's own ambulance takes you to that hospital. *Apollo's free in-city emergency service, as announced in 2021.</p>
</main>`;
};

V.tracking=()=>{
  if(!INC||!INC.amb)return top("Ambulance","ambulance")+`<main class="body"><div class="card"><b>No ambulance called yet</b><p class="muted">Call one from the list and it shows up here.</p><a class="btn red" href="#ambulance">Ambulance options</a></div></main>`;
  const a=INC.amb,p=PROVIDERS.find(x=>x.id===a.provider),s=INC.jobs.amb,steps=JOBS[0].steps;
  const etaMin=a.eta?Math.max(0,Math.round((a.eta-now())/60000)):null;
  const others=INC.calls.filter(c=>c.num!==p.num&&PROVIDERS.some(x=>x.num===c.num));
  const r=DB.ratings[p.id]||{};
  return top("Ambulance",kindRoute(INC.kind))+`<main class="body">
<div class="dark" style="gap:10px">
<div class="row" style="justify-content:space-between"><span style="font:700 13px/1 var(--display);letter-spacing:1px;text-transform:uppercase;opacity:.85">${esc(p.name)}</span><span class="pill ${s>=4?"ok":"red"}">${esc(steps[s])}</span></div>
<div class="row" style="align-items:baseline"><span class="big" id="eta">${etaMin==null?"–":"~"+etaMin}</span><span style="font-size:15px">${etaMin==null?"No ETA yet":"min away"}</span></div>
<div style="font-size:13px;opacity:.9">${a.vehicle?`Vehicle ${esc(a.vehicle)} · `:""}Called ${tstr(a.at)} · Keep this phone free for their call</div>
</div>
${(()=>{const ps=PROVIDERS.filter(x=>INC.calls.some(c=>c.num===x.num));return ps.length>1?`<div class="field"><label>Which one is coming?</label><div class="chips">${ps.map(x=>`<button type="button" class="chip" data-a="trackp" data-v="${x.id}" aria-pressed="${x.id===a.provider}">${esc(x.name)}</button>`).join("")}</div></div>`:""})()}
<div class="card" style="gap:2px">${steps.slice(1).map((t,i)=>{const k=i+1;const cls=k<s?"done":k===s?"now":"";const at=(INC.ambT||{})[k];return `<div class="step ${k<=s&&k!==s?"done":cls}"><span class="s">${k<s?ic("check","#fff",14,3):""}</span><span class="tx">${esc(t)}</span><span class="tm">${at?tstr(at):""}</span></div>`}).join("")}
${s<steps.length-1?`<button type="button" class="btn sm" data-a="next" data-k="amb" style="margin-top:8px">Mark: ${esc(steps[s+1])}</button>`:""}</div>
<div class="card"><h2 class="h2">Got a message from them?</h2><p class="muted">Paste the booking SMS. Sahaay reads the vehicle number and arrival time.</p>
<div class="field"><label for="sms">Their SMS</label><textarea id="sms" placeholder="Ambulance TS09UB4417 will reach you in 12 mins…"></textarea></div>
<div class="grid2"><button type="button" class="btn sm" data-a="parsesms">Read it</button><div class="field" style="flex-direction:row;gap:6px"><label for="etam" class="sr" style="position:absolute;left:-9999px">ETA in minutes</label><input id="etam" inputmode="numeric" placeholder="ETA min" style="min-height:44px"><button type="button" class="btn sm ghost" data-a="seteta">Set</button></div></div></div>
${others.length?`<div class="card warn"><b>You also called ${others.map(o=>esc(NUM[o.num]||o.num)).join(", ")}</b><p style="margin:0;font-size:13px">When one ambulance reaches you, call the other back and release it for someone else.</p><div class="grid2">${others.map(o=>`<a class="btn sm ghost" href="tel:${o.num}" data-a="call" data-n="${o.num}">Call ${esc(o.num.length>6?NUM[o.num]:o.num)} to cancel</a>`).join("")}</div></div>`:""}
<div class="card"><h2 class="h2">How was ${esc(p.name)}?</h2><p class="muted">Your answer moves providers up or down the list for you. Later, for everyone.</p>
<div class="field"><label>Did they answer?</label><div class="chips"><button type="button" class="chip" data-a="rate" data-k="answered" data-v="1" aria-pressed="${r.answered===true}">Yes</button><button type="button" class="chip" data-a="rate" data-k="answered" data-v="0" aria-pressed="${r.answered===false}">No</button></div></div>
<div class="field"><label>Were you charged?</label><div class="chips"><button type="button" class="chip" data-a="rate" data-k="charged" data-v="0" aria-pressed="${r.charged===false}">Free</button><button type="button" class="chip" data-a="rate" data-k="charged" data-v="1" aria-pressed="${r.charged===true}">Paid</button></div></div></div>
<div class="grid2"><a class="btn" href="tel:${p.num}" data-a="call" data-n="${p.num}">Call ${esc(p.id==="108"?"108":"them")}</a><a class="btn ghost" href="#family">Update family</a></div>
</main>`;
};

V.hospitals=()=>{
  const seg=S.hseg;
  const list=HOSP.map(h=>Object.assign({},h,{d:S.loc?km(S.loc,h):null})).sort((a,b)=>(a.d??0)-(b.d??0))
    .filter(h=>seg==="near"||seg==="rahat"||(seg==="govt"&&h.t.includes("govt"))||(seg==="private"&&!h.t.includes("govt"))||(seg==="kids"&&h.t.includes("kids")));
  const back=INC?kindRoute(INC.kind):"home";
  return top("Where to go",back)+`<main class="body" style="gap:10px">
<div class="chips">${[["near","Nearest ER"],["govt","Free · Govt"],["rahat","Cashless · PM-RAHAT"],["private","Private"],["kids","Children"]].map(f=>`<button type="button" class="chip" data-a="hseg" data-v="${f[0]}" aria-pressed="${seg===f[0]}">${f[1]}</button>`).join("")}</div>
${!S.loc?`<div class="card"><div class="row" style="justify-content:space-between"><b>Sort by distance</b><button class="btn sm" type="button" data-a="gps">${ic("loc","var(--paper)",18)}Use GPS</button></div><div class="field"><label for="area">Or pick your area</label><select id="area" data-c="area"><option value="">Choose…</option>${AREAS.map(a=>`<option>${esc(a[0])}</option>`).join("")}</select></div>${S.gpsErr?`<div class="status warn"><i></i>${esc(S.gpsErr)}</div>`:""}</div>`:""}
${seg==="rahat"||(INC&&INC.kind==="accident")?`<div class="card calm"><div style="font:700 17px/1.1 var(--display);text-transform:uppercase;color:#14513F">Road accident? Up to ₹1.5 lakh cashless</div><p style="margin:0;font-size:13px">PM-RAHAT covers 7 days at enrolled hospitals. Get admitted within 24 hours. At the desk, say “PM-RAHAT, road accident.” Enrolment per hospital isn't verified here yet, so ask.</p></div>`:""}
${list.slice(0,10).map(h=>{const nm=h.n+", "+h.a,ch=INC&&INC.hospName===nm;return `<div class="hosp ${ch?"chosen":""}"><div class="row" style="align-items:flex-start"><div style="flex:1;min-width:0"><div style="font-weight:700;font-size:15px">${esc(h.n)}</div><div class="muted" style="font-size:12px">${esc(h.a)} · 24h casualty</div></div><div class="km">${fmtKm(h.d)}<small>${h.d==null?"no location":"km approx"}</small></div></div>
<div class="chips" style="gap:4px">${h.t.includes("govt")?`<span class="pill free">Free · Govt</span>`:`<span class="pill">Private</span>`}${h.t.includes("kids")?`<span class="pill">Children</span>`:""}${h.t.includes("govt")?"":`<span class="pill warn">PM-RAHAT ?</span>`}</div>
<div class="grid2"><a class="btn sm ghost" href="https://www.google.com/maps/search/?api=1&amp;query=${encodeURIComponent(h.n+" "+h.a+" Hyderabad")}" target="_blank" rel="noopener">Directions</a>${INC?(ch?`<span class="btn sm calm">${ic("check","#fff",16,3)}Chosen</span>`:`<button type="button" class="btn sm" data-a="pickh" data-v="${esc(nm)}">Taking them here</button>`):""}</div></div>`}).join("")}
<p class="muted" style="font-size:12px">“?” means not verified yet. Trauma teams and free ICU beds go live as hospitals join. Distances are straight-line.</p>
</main>`+(INC?"":nav("hospitals"));
};

V.family=()=>{
  if(!INC)return top("Family","home")+`<main class="body"><div class="card"><b>No emergency in progress</b><p class="muted">Start one from SOS and its live status goes here.</p><p class="muted">Your emergency contacts: ${contacts().length?contacts().map(c=>esc(c[0]||c[1])).join(", "):"none yet"}. <a href="#me">Edit</a></p></div>${shareBtns(sosMsg(),"sentsos")}</main>`;
  const back=kindRoute(INC.kind);
  return top("Family & friends",back)+`<main class="body">
<div class="card"><h2 class="h2">Update they'll get</h2><pre class="msg" id="upd">${esc(updateMsg())}</pre>${shareBtns(updateMsg(),"sentfam")}</div>
<div class="card" style="background:#ECECE6;border-color:#ECECE6"><b>Live accident page</b><p class="muted">One link that always shows the latest status, with no phone numbers exposed. This needs sharing between phones, which comes next. For now, send the update again when something changes.</p></div>
<div class="card"><b>Victim can't speak?</b><p class="muted">Their phone's lock screen may show emergency contacts. iPhone: Emergency → Medical ID. Android: Emergency information.</p></div>
</main>`;
};

V.fire=()=>{ensureInc("fire");return top("Fire","home")+`<main class="body">
${bigcall("101","Fire service","Say what's burning, the floor, a landmark")}
<div class="card"><h2 class="h2">Get out first</h2><ol class="steps"><li>Shout “Fire!” and get everyone out. Leave your things.</li><li>Stay low under smoke. Cover your nose with a wet cloth.</li><li>Take the stairs. Never the lift.</li><li>Close doors behind you to slow the fire.</li><li>Once out, stay out. Tell firefighters if anyone is inside.</li></ol></div>
<div class="card warn"><h2 class="h2" style="color:var(--warn-ink)">Smell gas?</h2><p style="margin:0;font-size:14px">Don't switch anything on or off. No lighters. Open windows, close the cylinder regulator if it's safe, then call from outside.</p></div>
<div class="grid2"><a class="btn" href="#ambulance">${ic("amb","var(--paper)")}Someone's hurt</a><a class="btn ghost" href="#aid" data-a="openaid" data-v="burn">Burns first aid</a></div>
${locCard()}
<a class="listlink" href="#family">${ic("users")}<div style="flex:1"><div class="t">Tell family you're out</div><div class="muted">Sends where you are and the status</div></div>${ic("chev","var(--muted)")}</a>
${timeline()}
</main>`;};

V.danger=()=>{ensureInc("danger");return top("Danger","home")+`<main class="body">
<h1 class="h1">Can you talk safely?</h1>
${bigcall("112","Yes, I can talk","Police, fire, ambulance in one call")}
<div class="dark" style="gap:10px">
<div style="font:800 22px/1 var(--display);text-transform:uppercase">No, I can't talk</div>
<p style="margin:0;font-size:13px;opacity:.85">These are silent. No sound, no flash.</p>
<button type="button" class="listlink" data-a="silentshare" style="background:var(--ink2);border:0;color:var(--paper);text-align:left;width:100%">${ic("loc","var(--signal-hi)")}<div style="flex:1"><div class="t">Send my location silently</div><div style="font-size:12px;opacity:.8">${contacts().length?`To ${contacts().map(c=>esc(c[0]||c[1])).join(" & ")} by SMS`:"Pick who on WhatsApp"}</div></div>${ic("chev","var(--paper)",18)}</button>
<button type="button" class="listlink" data-a="fakecall" style="background:var(--ink2);border:0;color:var(--paper);text-align:left;width:100%">${ic("phone","var(--signal-hi)")}<div style="flex:1"><div class="t">Fake incoming call</div><div style="font-size:12px;opacity:.8">Rings in 10 seconds. A reason to step away.</div></div>${ic("chev","var(--paper)",18)}</button>
</div>
<div class="card"><div class="row">${ic("bell","var(--signal)")}<div style="flex:1"><div style="font-weight:700">Loud alarm</div><div class="muted">Hold to sound. Draws people nearby.</div></div><button type="button" class="btn sm red" data-hold="alarm" style="min-width:88px">Hold</button></div></div>
<div class="grid2"><a class="btn ghost" href="tel:100" data-a="call" data-n="100">Police · 100</a><a class="btn ghost" href="${mapsNear("police station")}" target="_blank" rel="noopener">Police near me</a></div>
${locCard()}
${timeline()}
</main>`;};
function mapsNear(q){const l=S.loc;return "https://www.google.com/maps/search/?api=1&amp;query="+encodeURIComponent(q+(l?` near ${l.lat.toFixed(4)},${l.lng.toFixed(4)}`:" near me"));}

V.women=()=>{ensureInc("women");return top("Woman in danger","home")+`<main class="body">
${bigcall("112","Emergency now","Police reach you fastest through 112")}
<div class="grid2">
<a class="btn" href="tel:181" data-a="call" data-n="181" style="flex-direction:column;gap:0;min-height:64px"><span style="font:800 26px/1 var(--display)">181</span><span style="font-size:12px">Women helpline</span></a>
<a class="btn" href="tel:100" data-a="call" data-n="100" style="flex-direction:column;gap:0;min-height:64px"><span style="font:800 26px/1 var(--display)">100</span><span style="font-size:12px">Police · ask for SHE Teams</span></a>
</div>

Object.keys(E).forEach(k=>{if(!KIND[k])KIND[k]=E[k].t;});
function kindRoute(k){return {accident:"accident",medical:"ambulance",fire:"fire",danger:"danger",women:"women"}[k]||("e-"+k);}
function curKind(){const r=route();if(r==="em")return location.hash.slice(3);if(r.indexOf("acc-")===0)return INC?INC.kind:"accident";if(r==="ambulance"||r==="tracking"||r==="cpr")return "medical";return r;}

/* nothing starts by itself any more */
ensureInc=function(){return INC;};
function triText(){
  const sym=(INC&&INC.symptom)||S.symptom;const p=[];
  if(INC){const t=INC.tri;if(t.inj)p.push(`${t.inj} injured`);if(t.con==="No")p.push("someone is unconscious");if(t.br==="No")p.push("someone is not breathing");if(t.bl==="Yes")p.push("heavy bleeding");if(t.veh.length)p.push("vehicles: "+t.veh.join(", ").toLowerCase());}
  if(sym){const s=SYMPTOMS.find(x=>x.id===sym);if(s&&s.id!=="other")p.push(s.t.toLowerCase());}
  return p.join(", ");
}
function script(){
  const l=S.loc,lm=INC&&INC.landmark;
  const where=l&&l.src==="area"?`near ${l.label}`:"at [say the road and area]";
  const what=(INC?KIND[INC.kind]:"Medical emergency").toLowerCase();
  const tri=triText();
  return `“${what.charAt(0).toUpperCase()+what.slice(1)} ${where}.${lm?` Landmark: ${lm}.`:" Landmark: [metro pillar, petrol bunk, junction]."}${tri?" "+tri.charAt(0).toUpperCase()+tri.slice(1)+".":""} Please send an ambulance.”`;
}
function timeline(){
  if(!INC||INC.kind!==curKind())return "";
  return `<div class="card"><h2 class="h2">Timeline</h2><ul class="log">${INC.log.slice().reverse().map(l=>`<li><time>${tstr(l.t)}</time>${esc(l.txt)}</li>`).join("")}</ul>
<a class="btn sm ghost" href="#end">End this emergency</a></div>`;
}
function activeBanner(){
  if(!INC)return "";
  return `<a class="listlink" href="#${kindRoute(INC.kind)}" style="background:var(--ink);color:var(--paper);border-color:var(--ink)">${ic("bell","var(--signal-hi)")}<div style="flex:1"><div class="t">Active: ${esc(KIND[INC.kind])}</div><div style="font-size:12px;opacity:.8">${esc(INC.id)} · started ${tstr(INC.start)} · tap to return</div></div>${ic("chev","var(--paper)")}</a>`;
}

function startCard(kind,blocking){
  if(INC&&INC.kind===kind){const mins=Math.floor((now()-INC.start)/60000);
    return `<div class="status" style="background:var(--ink);color:var(--paper);border-color:var(--ink);justify-content:space-between"><span class="row" style="gap:8px"><i style="background:var(--signal-hi)"></i>Active · ${tstr(INC.start)} · ${mins} min</span><a href="#end" style="color:var(--paper);font-weight:700">End</a></div>`;}
  if(INC)return `<div class="card warn"><b>You already have an active ${esc(KIND[INC.kind].toLowerCase())}.</b><div class="grid2"><a class="btn sm" href="#${kindRoute(INC.kind)}">Go to it</a><a class="btn sm ghost" href="#end">End it first</a></div></div>`;
  if(!blocking&&S.guide[kind])return "";

const SHARE_DEFAULT=new Set(["accident","medical","fire","flood","collapse","drown","shock","heat","lift","animal","snakeseen","labour","poison","acid","missing","lostchild"]);

/* ---- shared network (works inside Claude for invited people; local-only elsewhere) ---- */
const SY={db:null,uid:null,alerts:[],ready:false,err:null,tried:false};
(async()=>{
  try{
    if(!window.claude||typeof window.claude.use!=="function"){SY.tried=true;return;}
    const u=await window.claude.use("user");if(u){try{SY.uid=await u.id();}catch(e){}}
    const db=await window.claude.use("db");SY.tried=true;
    if(!db){onAlerts();return;}
    SY.db=db;
    const timer=setTimeout(()=>{if(!SY.ready){SY.err="slow";onAlerts();}},10000);
    db.collection("alerts").orderBy("updated","desc").limit(200).onSnapshot(snap=>{
      clearTimeout(timer);SY.ready=true;SY.err=null;
      SY.alerts=snap.docs.filter(d=>d.exists).map(d=>Object.assign({key:d.id},d.data()));
      mergeRemote();onAlerts();
    },e=>{clearTimeout(timer);SY.err=(e&&e.code)||"error";onAlerts();});
  }catch(e){SY.tried=true;}
})();
function liveAlerts(){
  return SY.alerts.filter(a=>a&&!a.ended&&typeof a.lat==="number"&&now()-(a.updated||0)<3*3600e3&&Object.keys(a.flags||{}).length<3);
}
function nearbyAlerts(maxKm){
  if(!S.loc)return [];
  return liveAlerts().map(a=>Object.assign({},a,{d:km(S.loc,a)})).filter(a=>a.d<=(maxKm||2)).sort((x,y)=>x.d-y.d);
}
function mergeRemote(){
  if(!INC||!INC.alertKey)return;const a=SY.alerts.find(x=>x.key===INC.alertKey);if(!a||!a.status)return;
  let changed=false;
  Object.keys(a.status).forEach(k=>{if(typeof a.status[k]==="number"&&INC.jobs[k]!=null&&a.status[k]>INC.jobs[k]){INC.jobs[k]=a.status[k];changed=true;}});
  if(a.hosp&&!INC.hospName){INC.hospName=a.hosp;changed=true;}
  if(changed){INC.log.push({t:now(),txt:"Updated by another helper on scene"});saveInc();}
}
let _alertsT=null;
function onAlerts(){
  clearTimeout(_alertsT);
  _alertsT=setTimeout(()=>{const r=route();const typing=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if(!typing&&["home","nearby","alert","accident","active","report"].includes(r))render(true);else updateNavBadge();},150);
}
function alertBody(){
  const l=INC.loc||S.loc;
  return {code:INC.id,kind:INC.kind,title:KIND[INC.kind]||"Emergency",
    lat:l?Math.round(l.lat*1000)/1000:null,lng:l?Math.round(l.lng*1000)/1000:null,
    area:l&&l.src==="area"?l.label:((nearestArea(l)||[""])[0]),landmark:(INC.landmark||"").slice(0,80),
    status:{amb:INC.jobs.amb,police:INC.jobs.police,hosp:INC.jobs.hosp,family:INC.jobs.family,tow:INC.jobs.tow},
    amb:INC.amb?((PROVIDERS.find(p=>p.id===INC.amb.provider)||{}).name||""):"",
    eta:INC.amb&&INC.amb.eta?INC.amb.eta:null,hosp:INC.hospName||"",ended:false};
}
let _syncT=null,_lastSig="";
function syncAlert(final){
  if(!SY.db||!INC||!INC.share||!INC.alertKey)return;
  clearTimeout(_syncT);
  const run=async()=>{
    const b=alertBody();if(final)b.ended=true;
    if(b.lat==null)return;
    const sig=JSON.stringify(b);if(sig===_lastSig)return;_lastSig=sig;
    try{const ref=SY.db.doc("alerts/"+INC.alertKey);const s=await ref.get();
      if(s.exists)await ref.update(Object.assign(b,{updated:now()},SY.uid?{helpers:{[SY.uid]:now()}}:{}));
      else await ref.set(Object.assign(b,{started:INC.start,updated:now(),helpers:SY.uid?{[SY.uid]:now()}:{},flags:{}}));
    }catch(e){SY.err=(e&&e.code)||"error";}
  };
  if(final)run();else _syncT=setTimeout(run,900);
}
const _addLog=addLog;
addLog=function(txt){_addLog(txt);syncAlert();};
const _startInc=startInc;
startInc=function(kind,extra){
  const share=extra&&"share" in extra?extra.share:SHARE_DEFAULT.has(kind);
  const r=_startInc(kind,Object.assign({},extra||{}));
  INC.id=newId(kind);INC.share=!!share&&!(FL[kind]&&FL[kind].private);
  INC.alertKey=INC.alertKey||(INC.id+"-"+Math.random().toString(36).slice(2,6));
  INC.log[0]&&(INC.log[0].txt=`${KIND[kind]} started · ${INC.id}`);
  saveInc();syncAlert();return INC;
};

function statusLine(a){
  const st=a.status||{};const parts=[];
  const lab=(id)=>JOBS.find(j=>j.id===id).steps[st[id]||0];
  parts.push(["Ambulance",st.amb?lab("amb")+(a.amb?" · "+a.amb:""):"Not called",st.amb?(st.amb>=3?"ok":"warn"):"red"]);
  if(a.kind==="accident"){parts.push(["Police",lab("police"),st.police?"ok":"red"]);parts.push(["Road",lab("tow"),st.tow?"ok":"red"]);}
  parts.push(["Hospital",a.hosp||"Not chosen",a.hosp?"ok":"red"]);
  return parts;
}
function ago(t){const m=Math.max(0,Math.round((now()-t)/60000));return m<1?"just now":m<60?`${m} min ago`:`${Math.floor(m/60)} h ago`;}
function alertCard(a,compact){

  return `<button type="button" data-a="openalert" data-v="${esc(a.key)}" class="listlink" style="width:100%;text-align:left;flex-direction:column;align-items:stretch;gap:8px;${compact?"background:var(--ink);color:var(--paper);border-color:var(--ink)":""}">

  ${compact?"":`<div class="chips" style="gap:4px">${statusLine(a).map(p=>`<span class="pill ${p[2]}">${esc(p[0])}: ${esc(p[1])}</span>`).join("")}</div>`}</button>`;
}
function netNote(){
  if(!SY.tried)return `<div class="status"><i></i>Connecting to people nearby…</div>`;
  if(!SY.db)return `<div class="status warn"><i></i>Nearby works when Sahaay is opened from its shared link while signed in. Here, you only see your own emergency.</div>`;
  if(SY.err==="slow")return `<div class="status warn"><i></i>Can't reach the network yet. What you see may be out of date.</div>`;
  if(SY.err)return `<div class="status warn"><i></i>Nearby is read-only for you right now.</div>`;
  return `<div class="status ok"><i></i>Connected · showing emergencies within 2 km</div>`;
}

/* =============== v5: one pattern for every emergency — gate, then dashboard =============== */
JOBS.push({id:"fire",t:"Fire service",icon:"fire",call:["101"],steps:["Not called","Called","On the way","At the scene","Fire out"],hint:""});
JOBS.push({id:"help",t:"Helpline",icon:"phone",call:[],steps:["Not called","Called","Following their advice","Sorted"],hint:""});
const JOB_META={amb:["Ambulance","amb"],police:["Police","badge"],hosp:["Hospital","hosp"],family:["Family","users"],tow:["Clear the road","tow"],paper:["Paperwork","card"],fire:["Fire service","fire"],help:["Helpline","phone"]};
const JOB_NEXT={amb:"Get an ambulance",police:"Inform the police",hosp:"Choose a hospital",family:"Tell family",tow:"Get the road cleared",paper:"Paperwork for later",fire:"Call the fire service",help:"Call the helpline"};
const FIXED_JOBS={medical:["amb","hosp","family"],fire:["fire","amb","family"],danger:["police","family"],women:["police","help","family"]};
const FIXED_HELP={women:["181","Women helpline"],medical:["108","Ambulance"],fire:["101","Fire service"],danger:["112","Emergency"]};
function flowNums(kind){const F=FL[kind];const out=[];if(!F)return out;
  [F.nodes[F.start]].concat(Object.values(F.nodes)).forEach(n=>{if(!n)return;if(n.call)out.push(n.call[0]);(n.calls||[]).forEach(c=>out.push(c));(n.tools||[]).forEach(t=>{if(t==="amb")out.push("108");if(t==="hosp")out.push("hosp");if(t==="cpr")out.push("108");});});return out;}
function jobsFor(kind){
  if(kind==="accident")return ["amb","police","hosp","family","tow","paper"];
  if(FIXED_JOBS[kind])return FIXED_JOBS[kind];
  const map={"108":"amb","100":"police","112":"police","101":"fire","hosp":"hosp"};
  const js=[];flowNums(kind).forEach(n=>{const j=map[n]||"help";if(!js.includes(j))js.push(j);});
  if(js.includes("amb")&&!js.includes("hosp"))js.push("hosp");
  js.push("family");return [...new Set(js)];
}
function helpFor(kind){
  if(FIXED_HELP[kind])return FIXED_HELP[kind];
  const n=flowNums(kind).find(x=>!["108","100","112","101","hosp"].includes(x));
  return n?[n,NUM[n]||"Helpline"]:null;
}
const _startInc5=startInc;
startInc=function(kind,extra){const r=_startInc5(kind,extra);INC.jobset=jobsFor(kind);INC.help=helpFor(kind);JOBS.forEach(j=>{if(INC.jobs[j.id]==null)INC.jobs[j.id]=0;});saveInc();return r;};
function jobsOf(){return (INC&&INC.jobset)||jobsFor(INC.kind);}
function jobLabel(id){const st=jobState(id);if(id==="help"&&INC.help&&st.s===0)return "Not called";return st.label;}
function tileRoute(id){const acc=INC.kind==="accident";
  return {amb:INC.amb?"tracking":(acc?"acc-amb":"ambulance"),police:acc?"acc-police":"j-police",hosp:acc?"acc-hosp":"hospitals",family:"acc-family",tow:"acc-road",paper:"acc-paper",fire:"j-fire",help:"j-help"}[id];}

/* =============== audio: CPR beat, alarm, ringtone =============== */
let AC=null;
function ac(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();}catch(e){AC=null;}return AC;}
function tone(f,d,type,vol){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||"square";o.frequency.value=f;g.gain.value=vol||.2;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);}
let cprT=null,cprClock=null;
function startCPR(){S.cpr={on:true,n:0,start:now()};addLog("CPR started");render(true);
  cprT=setInterval(()=>{S.cpr.n++;tone(1000,.05,"square",.25);try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}const n=$("#cprn");if(n)n.textContent=S.cpr.n;},545);
  cprClock=setInterval(()=>{const t=$("#cprt");if(!t)return;const el=Math.floor((now()-S.cpr.start)/1000);t.innerHTML=`${el>=120&&el%120<10?"<b>Swap now if someone can take over</b> · ":"Swap with someone at 2:00 · "}<b>${Math.floor(el/60)}:${String(el%60).padStart(2,"0")}</b>`;},1000);}
function stopCPR(){clearInterval(cprT);clearInterval(cprClock);if(S.cpr.on)addLog(`CPR stopped after ${S.cpr.n} pushes`);S.cpr.on=false;}
let alarmNode=null;
function alarmOn(){const a=ac();if(!a||alarmNode)return;const o=a.createOscillator(),g=a.createGain(),l=a.createOscillator(),lg=a.createGain();
  o.type="sawtooth";o.frequency.value=900;l.frequency.value=3;lg.gain.value=400;l.connect(lg);lg.connect(o.frequency);g.gain.value=.6;o.connect(g);g.connect(a.destination);o.start();l.start();alarmNode=[o,l];}
function alarmOff(){if(alarmNode){alarmNode.forEach(n=>{try{n.stop()}catch(e){}});alarmNode=null;}}
let ringT=null,fakeT=null;
function fakeCall(){
  toast("Fake call in 10 seconds. Lock or pocket your phone.");
  if(INC&&route()!=="em")addLog("Fake call set");
  clearTimeout(fakeT);
  fakeT=setTimeout(()=>{
    const name=(DB.mid.c1n||"Amma");
    $("#layer").innerHTML=`<div class="overlay" role="dialog" aria-label="Incoming call"><div><div class="sub">Incoming call…</div><div class="who" style="margin-top:12px">${esc(name)}</div><div class="sub">mobile</div></div><div class="acts"><button type="button" data-a="fakeend" style="background:#D7261E" aria-label="Decline">End</button><button type="button" data-a="fakeans" style="background:#1F6F5C" aria-label="Answer">Answer</button></div></div>`;
    const ring=()=>{tone(440,.4,"sine",.25);setTimeout(()=>tone(480,.4,"sine",.25),450);try{navigator.vibrate&&navigator.vibrate([400,200,400])}catch(e){}};
    ring();ringT=setInterval(ring,2000);
  },10000);
}
function fakeEnd(answered){clearInterval(ringT);
  if(answered){$("#layer").innerHTML=`<div class="overlay" role="dialog" aria-label="On call"><div><div class="sub">On call</div><div class="who" style="margin-top:12px">${esc(DB.mid.c1n||"Amma")}</div><div class="sub" id="fk">00:00</div></div><div class="acts"><button type="button" data-a="fakeend" style="background:#D7261E">End</button></div></div>`;
    const st=now();ringT=setInterval(()=>{const e=Math.floor((now()-st)/1000),el=$("#fk");if(el)el.textContent=`${String(Math.floor(e/60)).padStart(2,"0")}:${String(e%60).padStart(2,"0")}`;},1000);}
  else $("#layer").innerHTML="";
}

});
/* hold-to-sound alarm */
document.addEventListener("pointerdown",e=>{const b=e.target.closest('[data-hold="alarm"]');if(b){e.preventDefault();alarmOn();b.textContent="Sounding";if(INC)addLog("Alarm sounded");}});
["pointerup","pointercancel","pointerleave"].forEach(t=>document.addEventListener(t,e=>{if(alarmNode){alarmOff();const b=document.querySelector('[data-hold="alarm"]');if(b)b.textContent="Hold";}}));

/* live clocks */
setInterval(()=>{
  document.querySelectorAll("[data-timer]").forEach(el=>{const st=S.timers[el.dataset.timer];if(!st)return;const sec=(now()-st)/1000;el.textContent=el.dataset.up?fmtT(sec):fmtT(+el.dataset.dur-sec);
    if(!el.dataset.up&&sec>=+el.dataset.dur&&!el.dataset.done){el.dataset.done=1;tone(880,.3,"sine",.3);try{navigator.vibrate&&navigator.vibrate([300,100,300])}catch(e){}toast("Time's up");}});
  const c2=$("#clk2");if(c2){const s=Math.max(0,Math.floor((now()-(+c2.dataset.start))/1000));c2.textContent=`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;}
  const bt=$("#breathTxt");if(bt)bt.textContent=(Math.floor(now()/1000)%10)<4?"Breathe in":"Breathe out";
  if(!INC)return;const r=route();
  if(r==="accident"){const c=clock(),a=$("#clk"),b=$("#clkbar");if(a)a.textContent=c.txt;if(b)b.style.width=c.pct+"%";}
  if(r==="tracking"&&INC.amb&&INC.amb.eta){const e=$("#eta");if(e)e.textContent="~"+Math.max(0,Math.round((INC.amb.eta-now())/60000));}
},1000);

/* offline install (only where allowed) */
try{if("serviceWorker" in navigator&&location.protocol==="https:"&&!/claude|claudeusercontent/.test(location.host))navigator.serviceWorker.register("sw.js").catch(()=>{});}catch(e){}

render();
if(!S.loc)try{navigator.permissions&&navigator.permissions.query({name:"geolocation"}).then(p=>{if(p.state==="granted")gps();}).catch(()=>{});}catch(e){}
})();
</script>
</body>
</html>
